name: Build & Release Moira Luxe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Populate Environment Configuration
        shell: pwsh
        env:
          SECRET_ENV: ${{ secrets.ENV_FILE }}
        run: |
          if ($env:SECRET_ENV) {
            Set-Content -Path "backend/.env" -Value $env:SECRET_ENV -Encoding utf8
            Write-Host "Injected .env from GitHub Secrets."
          } else {
            Write-Host "Warning: ENV_FILE secret not found. Using repository default if present."
          }

      - name: Compile Executable with PyInstaller
        run: |
          cd backend
          pyinstaller --noconfirm MoiraLuxe.spec

      - name: Determine Release Tag
        id: get_tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main") {
            $tag = "${{ inputs.version }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release with Executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.get_tag.outputs.tag }}"
          gh release create $tag "backend/dist/MoiraLuxe.exe" --title "Moira Luxe POS $tag" --notes "Production release $tag with standalone Windows executable MoiraLuxe.exe."
